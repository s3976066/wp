<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetConnect - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <span class="material-icons me-2">pets</span> PetConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="pets.html">Browse Pets</a></li>
                        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                        <li class="nav-item"><a class="nav-link" href="add.html">Add Pet</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div id="heroCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
            <div class="carousel-inner rounded shadow-sm">
                <div class="carousel-item active"><img src="assets/images/image1.jpg" class="carousel-img" alt="Banner 1"></div>
                <div class="carousel-item"><img src="assets/images/image2.jpg" class="carousel-img" alt="Banner 2"></div>
                <div class="carousel-item"><img src="assets/images/image3.jpg" class="carousel-img" alt="Banner 3"></div>
                <div class="carousel-item"><img src="assets/images/image4.jpg" class="carousel-img" alt="Banner 4"></div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <h2 class="mb-4 text-white"><span class="material-icons align-middle text-secondary-custom">favorite</span> Recently Added Pets</h2>
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card shadow-sm h-100">
                    <img src="assets/images/pets/buddy.jpg" class="card-img-top" alt="Buddy">
                    <div class="card-body">
                        <h5 class="card-title">Buddy</h5>
                        <p class="card-text fw-bold">$250.00</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm h-100">
                    <img src="assets/images/pets/whiskers.jpg" class="card-img-top" alt="Whiskers">
                    <div class="card-body">
                        <h5 class="card-title">Whiskers</h5>
                        <p class="card-text fw-bold">$150.00</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm h-100">
                    <img src="assets/images/pets/max.jpg" class="card-img-top" alt="Max">
                    <div class="card-body">
                        <h5 class="card-title">Max</h5>
                        <p class="card-text fw-bold">$200.00</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm h-100">
                    <img src="assets/images/pets/charlie.jpg" class="card-img-top" alt="Charlie">
                    <div class="card-body">
                        <h5 class="card-title">Charlie</h5>
                        <p class="card-text fw-bold">$120.00</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Yizhao Zheng (s3976066). Connecting pets with loving homes.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/scripts.js"></script>
</body>
</html>
