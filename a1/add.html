<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetConnect - Add Pet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <span class="material-icons me-2">pets</span> PetConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="pets.html">Browse Pets</a></li>
                        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                        <li class="nav-item"><a class="nav-link active" href="add.html">Add Pet</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h2 class="mb-4 text-primary-custom"><span class="material-icons align-middle">add_circle</span> Add a New Pet for Adoption</h2>
        <form action="#" method="POST" class="form-container p-4 shadow-sm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Pet Name *</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter pet name" required>
                </div>
                <div class="col-md-6">
                    <label for="species" class="form-label">Species *</label>
                    <select class="form-select" id="species" name="species" required>
                        <option value="" disabled selected>Select species</option>
                        <option value="Dog">Dog</option><option value="Cat">Cat</option><option value="Bird">Bird</option><option value="Rabbit">Rabbit</option><option value="Other">Other</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="breed" class="form-label">Breed</label>
                    <input type="text" class="form-control" id="breed" name="breed" placeholder="Enter breed">
                </div>
                <div class="col-md-3">
                    <label for="age_years" class="form-label">Age (Years)</label>
                    <input type="number" class="form-control" id="age_years" name="age_years" placeholder="Years">
                </div>
                <div class="col-md-3">
                    <label for="age_months" class="form-label">Age (Months)</label>
                    <input type="number" class="form-control" id="age_months" name="age_months" placeholder="Months">
                </div>

                <div class="col-md-4">
                    <label for="gender" class="form-label">Gender *</label>
                    <select class="form-select" id="gender" name="gender" required>
                        <option value="" disabled selected>Select gender</option>
                        <option value="Male">Male</option><option value="Female">Female</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="size" class="form-label">Size *</label>
                    <select class="form-select" id="size" name="size" required>
                        <option value="" disabled selected>Select size</option>
                        <option value="Small">Small</option><option value="Medium">Medium</option><option value="Large">Large</option><option value="Extra Large">Extra Large</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="adoption_fee" class="form-label">Adoption Fee ($) *</label>
                    <input type="number" class="form-control" id="adoption_fee" name="adoption_fee" placeholder="Enter fee" required>
                </div>

                <div class="col-12">
                    <label for="description" class="form-label">Description *</label>
                    <textarea class="form-control" id="description" name="description" rows="3" placeholder="Describe the pet's personality and characteristics" required></textarea>
                </div>

                <div class="col-12">
                    <label for="health_info" class="form-label">Health Information</label>
                    <textarea class="form-control" id="health_info" name="health_info" rows="2" placeholder="Enter health and vaccination information"></textarea>
                </div>

                <div class="col-12">
                    <label for="status" class="form-label">Status *</label>
                    <select class="form-select" id="status" name="status" required>
                        <option value="" disabled selected>Select status</option>
                        <option value="Available">Available</option><option value="Pending">Pending</option><option value="Adopted">Adopted</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="image" class="form-label">Pet Photo</label>
                    <input type="file" class="form-control" id="image" name="image" accept=".jpg,.jpeg,.png,.gif,.webp">
                    <img id="imagePreview" class="d-none mt-3 rounded shadow-sm" width="200" alt="Preview">
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary-custom px-4 me-2">Add Pet</button>
                    <button type="reset" class="btn btn-secondary-custom px-4">Cancel</button>
                </div>
            </div>
        </form>
    </main>

    <footer>
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Yizhao Zheng (s3976066). Connecting pets with loving homes.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/scripts.js"></script>
</body>
</html>
